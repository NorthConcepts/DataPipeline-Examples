# Curated, in-tree exemplars — the known-good file to copy patterns from for each
# example pattern. Keep paths here current; this is the single place to fix on drift.
# Paths are repo-relative to DataPipeline-Examples/.
#
# status: available = the recipe/skeleton + this exemplar are ready to use.

file_to_file:
  status: available
  recipe: docs/authoring/Example.md
  skeleton: docs/authoring/_skeletons/FileExample.java.txt
  exemplar: src/main/java/com/northconcepts/datapipeline/examples/cookbook/WriteACsvFileToFixedWidth.java
  fixture: example/data/input/credit-balance-01.csv
  note: >
    28 lines. CSVReader(File) -> FixedWidthWriter(File) -> Job.run. The canonical
    shape; also the page the README names in its run command.

file_to_stdout:
  status: available
  recipe: docs/authoring/Example.md
  skeleton: docs/authoring/_skeletons/FileExample.java.txt
  exemplar: src/main/java/com/northconcepts/datapipeline/examples/cookbook/ReadJsonLinesAsRecord.java
  fixture: data/input/json-input-with-lines.jsonl
  note: >
    20 lines. Reader -> StreamWriter.newSystemOutWriter() -> Job.run; also shows the
    newer data/input root. Use stdout whenever the output format is readable; ~130
    examples do. (ReadACsvFile.java is the manual open/read/close loop variant.)

memory_to_file:
  status: available
  recipe: docs/authoring/Example.md
  skeleton: docs/authoring/_skeletons/MemoryExample.java.txt
  exemplar: src/main/java/com/northconcepts/datapipeline/examples/cookbook/WriteSimpleJsonFile.java
  alternate: src/main/java/com/northconcepts/datapipeline/examples/cookbook/WriteSimpleXmlFile.java
  note: >
    33 lines. RecordList + MemoryReader -> SimpleJsonWriter(File).setPretty(true) ->
    Job.run; no fixture, no comments. The alternate is the same shape for XML.

new_module:
  status: available
  recipe: docs/authoring/Example.md
  skeleton: docs/authoring/_skeletons/MemoryExample.java.txt
  exemplar: src/main/java/com/northconcepts/datapipeline/examples/latex/WriteALatexFile.java
  build_line: build.gradle   # implementation "...-integrations-latex:${version}" added in the same PR (#241)
  note: >
    The model PR shape for a module not yet in build.gradle: one Java file + one
    implementation line. Copy the PR shape, not the file's length: at 77 lines it is
    a deliberate exception to the 20–60-line rule (five records chosen to show every
    LaTeX-escaped character), and the one case where short trailing // comments are
    justified. A new example still targets 20–60 lines.

external_service:
  status: available
  recipe: docs/authoring/Example.md
  skeleton: docs/authoring/_skeletons/ExternalServiceExample.java.txt
  exemplar: src/main/java/com/northconcepts/datapipeline/examples/amazons3/ReadFromAmazonS3.java
  alternate: src/main/java/com/northconcepts/datapipeline/examples/jira/AddJiraComments.java
  note: >
    Placeholder constants (ACCESS_KEY / SECRET_KEY / BUCKET / KEY), open the file
    system, try/finally close, NullWriter + record count when the payload isn't the
    point. Compiles in CI, cannot run there — expected.

credential_source:
  status: available
  recipe: docs/authoring/Example.md
  skeleton: docs/authoring/_skeletons/ExternalServiceExample.java.txt
  exemplar: src/main/java/com/northconcepts/datapipeline/examples/security/ReadFromAmazonS3UsingEnvironmentCredentials.java
  alternate: src/main/java/com/northconcepts/datapipeline/examples/security/ReadFromAmazonS3UsingRotatingCredentialsFile.java
  note: >
    The one sanctioned reader of ambient configuration: the capability IS the
    credential source, so it names the environment variables / properties file it
    reads (AWS_ACCESS_KEY_ID, example/data/input/s3-credentials.properties) and
    never a value. Every other example keeps placeholder constants.

google_oauth:
  status: available
  recipe: docs/authoring/Example.md
  skeleton: docs/authoring/_skeletons/ExternalServiceExample.java.txt
  exemplar: src/main/java/com/northconcepts/datapipeline/examples/google/sheets/ReadAGoogleSheet.java
  alternate: src/main/java/com/northconcepts/datapipeline/examples/google/sheets/WriteToAGoogleSheet.java
  note: >
    The installed-app authorize() block: GsonFactory, client secret loaded from
    src/main/resources (gitignored *.json), FileDataStoreFactory under the
    gitignored tokens/, LocalServerReceiver on 8888. Copy from here, not from the
    older calendar/gmail/contacts examples, which still carry Javadoc. One
    tokens/<api>[-readonly] directory per OAuth scope.

custom_component:
  status: available
  recipe: docs/authoring/Example.md
  skeleton: docs/authoring/_skeletons/CustomComponentExample.java.txt
  exemplar:
    component: src/main/java/com/northconcepts/datapipeline/examples/cookbook/customization/MyTransformer.java
    main: src/main/java/com/northconcepts/datapipeline/examples/cookbook/customization/WriteMyOwnTransformer.java
  siblings: MyDataReader/WriteMyOwnDataReader, MyDataWriter/WriteMyOwnDataWriter, MyFilter/WriteMyOwnFilterOrValidator, MyLookup/WriteMyOwnLookup, MyProxyReader, MyProxyWriter
  note: >
    Two files in cookbook/customization: the component (My<Base>) and the runnable
    main (WriteMyOwn<Base>). The component's contract comes from the core repo's
    DataPipeline/docs/authoring/<Base>.md — don't re-derive it here.

foundations:
  status: available
  recipe: docs/authoring/Example.md
  skeleton: docs/authoring/_skeletons/MemoryExample.java.txt
  exemplar: src/main/java/com/northconcepts/datapipeline/foundations/examples/schema/AddArrayFieldsToEntities.java
  alternate: src/main/java/com/northconcepts/datapipeline/foundations/examples/pipeline/ReadFromCsvWriteToExcel.java
  note: >
    Foundations examples live under foundations/examples/<area>, publish under the
    datapipeline-foundations category, and often print schema.toXml()/pipeline JSON
    between separator lines instead of running a Job.

data_fixture:
  status: available
  recipe: docs/authoring/DataFixture.md
  exemplar:
    classic: example/data/input/credit-balance-01.csv
    format_set: data/input/transformer-input.jsonl
    lfs_rules: .gitattributes
  consumers: DataConverter.io src/test/java/.../FileConverterUrlBaseTest.java (fetches data/input/transformer-input.* from master)
  note: >
    data/input/transformer-input.<ext> is one dataset in every format; a new format
    means a converted copy, never an edit. Large CSVs are LFS.
